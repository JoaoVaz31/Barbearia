<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contato - Barbearia</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Cabeçalho -->
  <header>
    <nav>
      <div class="logo">
        <img src="images/logo.png" alt="Barbearia Logo" />
      </div>
      <ul class="menu">
        <li><a href="index.html">Home</a></li>
        <li><a href="galeria.html">Galeria</a></li>
        <li><a href="contacto.html">Contato</a></li>
        <li><a href="sobre.html">Sobre Nós</a></li>
      </ul>
    </nav>
  </header>

  <!-- Formulário de Contato -->
  <section class="contact">
    <h1>Entre em Contato</h1>
    <form>
      <label for="nome">Nome:</label>
      <input type="text" id="nome" required><br>

      <label for="email">E-mail:</label>
      <input type="email" id="email" required><br>

      <label for="mensagem">Mensagem:</label><br>
      <textarea id="mensagem" required></textarea><br>

      <button type="submit" class="submit-btn">Enviar</button>
    </form>
  </section>

  <!-- Rodapé -->
  <footer>
    <p>Nome da Barbearia</p>
    <ul class="social-links">
      <li><a href="https://facebook.com/sua-barbearia" target="_blank">Facebook</a></li>
      <li><a href="https://instagram.com/sua-barbearia" target="_blank">Instagram</a></li>
    </ul>
  </footer>

  <script src="server.js"></script>
</body>
</html>
